spring:
  application:
    name: notion-folio

  # Virtual Thread 활성화: WebFlux 없이 높은 동시성을 얻는다.
  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false          # OSIV 끄기 - 커넥션 점유 시간을 Service 범위로 제한
    hibernate:
      ddl-auto: validate         # 스키마 변경은 Flyway가 전담
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null   # null 필드는 응답에서 제외
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000

# Notion 연동. 비밀값은 환경변수로만 주입한다.
notion:
  token: ${NOTION_TOKEN:}
  version: ${NOTION_VERSION:2026-03-11}   # PRD 가정값. Task 006(D-4)에서 최신 문서로 재확인
  projects-data-source-id: ${NOTION_PROJECTS_DATA_SOURCE_ID:}
  about-page-id: ${NOTION_ABOUT_PAGE_ID:}

admin:
  api-key: ${ADMIN_API_KEY:}

sync:
  scheduler:
    enabled: ${SYNC_SCHEDULER_ENABLED:true}
  fixed-delay: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.poco7250.notionfolio: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # 바인딩 파라미터 확인용 (운영에서는 제거)
